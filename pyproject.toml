[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentpilot"
version = "0.1.0"
description = "Autonomous incident-response agent: alert -> root cause -> Slack brief -> resolution report"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    # Plain uvicorn, not [standard]: those extras (uvloop/httptools/watchfiles) are
    # compiled, and the slim runtime image carries no toolchain. A webhook receiver
    # gains nothing measurable from them.
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[project.optional-dependencies]
voyage = ["voyageai>=0.3"]
dev = ["pytest>=8.0"]

[project.scripts]
incidentpilot = "incidentpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
